  - package-ecosystem: "docker-compose"
    directories:
      - "/inżynier/TIR - Technologie Internetu Rzeczy/lab3/project"
      - "/masigster/ClC - Cloud Computing/ClC_Lab1/mqtt"
      - "/masigster/ClC - Cloud Computing/ClC_Lab2"
      - "/masigster/SBD - Systemy Baz Danych/wyszukiwarki/Radoslaw_Relidzynski_WCY20IX3S4_db_typu_wyszukiwarki"
    schedule:
      interval: "weekly"
